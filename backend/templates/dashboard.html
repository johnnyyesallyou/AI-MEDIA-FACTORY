<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Media Factory Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
            min-height: 100vh;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }
        h1 { font-size: 28px; font-weight: 700; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .stat-card h3 { font-size: 14px; color: rgba(255, 255, 255, 0.7); margin-bottom: 10px; }
        .stat-card .value { font-size: 36px; font-weight: 700; }
        .stat-card .trend { font-size: 12px; margin-top: 5px; color: #4ade80; }
        .section {
            background: rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .section h2 {
            font-size: 20px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
        }
        .channels-list { display: grid; gap: 15px; }
        .channel-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .channel-info h4 { font-size: 16px; margin-bottom: 5px; }
        .channel-info p { font-size: 13px; color: rgba(255, 255, 255, 0.7); }
        .status-badge { padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .status-online { background: #22c55e; }
        .status-offline { background: #ef4444; }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary { background: #3b82f6; color: white; }
        .btn-primary:hover { background: #2563eb; transform: translateY(-2px); }
        .loading { text-align: center; padding: 40px; font-size: 18px; }
        .error { background: #ef4444; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 AI Media Factory</h1>
            <button class="btn btn-primary" onclick="refreshData()">🔄 Обновить</button>
        </header>
        
        <div id="error-container"></div>
        
        <div class="stats-grid" id="stats-container">
            <div class="loading">Загрузка статистики...</div>
        </div>
        
        <div class="section">
            <h2>🏠 System Health</h2>
            <div id="health-container">
                <div class="loading">Загрузка статуса системы...</div>
            </div>
        </div>
        
        <div class="section">
            <h2>📡 Channels</h2>
            <button class="btn btn-primary" style="margin-bottom: 15px;" onclick="showCreateChannelModal()">+ Новый канал</button>
            <div class="channels-list" id="channels-container">
                <div class="loading">Загрузка каналов...</div>
            </div>
        </div>
        
        <div class="section">
            <h2>🤖 AI Models Routing</h2>
            <div id="ai-routing-container">
                <div class="loading">Загрузка конфигурации AI...</div>
            </div>
        </div>
    </div>
    
    <script src="/static/js/dashboard.js"></script>
</body>
</html>
