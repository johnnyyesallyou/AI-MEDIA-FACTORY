name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint + Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Lint (Ruff)
        id: lint
        run: |
          ruff check backend core --select E,F --exit-zero

      - name: Run unit tests (no integration)
        id: unit
        env:
          APP_ENV: test
          TEST_DB: sqlite
        run: |
          pytest tests/ -m "not integration" --timeout=60 -q --tb=short

      - name: Run CI tests
        id: citests
        env:
          APP_ENV: test
        run: |
          pytest tests/ci/ -q --tb=short

      - name: Summary
        if: always()
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "- Lint: ${{ steps.lint.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Unit tests: ${{ steps.unit.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- CI tests: ${{ steps.citests.outcome }}" >> $GITHUB_STEP_SUMMARY