[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
norecursedirs = scripts/legacy backend frontend .git .venv node_modules __pycache__ data data_backup_*
addopts = -v --tb=short --no-header -q --timeout=300
markers =
    asyncio: marks tests as async (requires pytest-asyncio)
    integration: marks tests as integration tests (requires external services like Ollama LLM)
